spring:
  application:
    name: fleet-maintenance
  config:
    # application-local.yml is gitignored -- copy application-local.yml.example
    # to it and put your local Postgres credentials there instead of editing
    # this file. Mirrors the old db.properties / db.properties.example pattern.
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/TIP
    username: postgres
    password: ""
  jpa:
    hibernate:
      # MVP: no migration tool (Flyway/Liquibase) is set up yet, so Hibernate
      # manages the schema directly. Revisit before this goes to production.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    # CAM-117: en local, Mailpit (https://mailpit.axllent.org): SMTP en 1025 y la bandeja web en
    # http://localhost:8025. Para un deploy, pisar host/puerto/usuario/contraseña en application-local.yml.
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: 8080
  servlet:
    # Centralizes the /api prefix here instead of repeating it on every
    # @RestController's @RequestMapping -- controllers map plain paths like
    # /vehicles, /photos, /inspections/{vehicleId}.
    context-path: /api

fleetguard:
  cors:
    # Origenes permitidos para que el frontend (Vite) consuma la API en dev.
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  jwt:
    # Secreto de firma -- Keys.hmacShaKeyFor (JwtService) elige el algoritmo
    # HMAC según el largo de esta clave; con 64 caracteres (512 bits) firma en
    # HS512, no HS256. Este valor es SOLO para desarrollo local, se commitea a
    # propósito para que el proyecto funcione out-of-the-box (igual que el
    # password vacío de Postgres arriba). Sobreescribilo en
    # application-local.yml antes de exponer esto fuera de tu máquina.
    secret: HUKfjtGyMHxMPOgQMtZsS5XQD8pMYMAxNTa2ss1fa68R8B29qcfAnxSB7SYQr2JG
    # 12 horas (CAM-85): el chofer no tiene que volver a entrar entre el pre-viaje y el post-viaje.
    expiration-minutes: 720
  photos:
    # Local-filesystem photo storage (see storage/LocalFilesystemPhotoStorage).
    # Swap PhotoStorage's implementation for a cloud-backed one later; nothing
    # else in the app should need to change.
    storage-dir: ./uploads/photos
  odometer:
    # CAM-90: una lectura de km (inspección, OT, mantenimiento hecho) actualiza el vehículo solo si
    # no supera al actual en más de esto. Frena errores de tipeo, que no se podrían corregir porque
    # el odómetro no baja. Ver service/OdometerReadings.
    max-jump-km: 5000
  trips:
    # CAM-101: a las cuántas horas de abierto se le recuerda al chofer que cierre el viaje, y cada
    # cuánto se revisa (cron de Spring: segundo minuto hora día mes día-de-semana; acá, cada hora).
    reminder-after-hours: 12
    reminder-cron: "0 0 * * * *"
  push:
    # CAM-119: claves VAPID con las que el servidor firma las push al navegador. Igual que el secreto
    # del JWT, este par es SOLO para desarrollo local y se commitea a propósito, para que el proyecto
    # ande sin configurar nada. Para un deploy, generar otro y pisarlo en application-local.yml
    # (cambiarlo invalida las suscripciones ya hechas). Vacías, la push se apaga sin romper nada.
    public-key: BKxlwImnwTE3lIxq80BPqCK_OXHCr99VaymbSmhSWg_oiAdaZpNE9xDxYWnAILceWOQV8P3gd1ZyGdFq5wjZYfk
    private-key: 9M6iS3GP2Kf691Lx1pzJLaoslLYgCAETR2hq9dnzQ8g
    # Contacto que el servicio de push del navegador puede usar si hay un problema con los envíos.
    subject: "mailto:fleetguard@example.com"
  mail:
    # CAM-117: false apaga el envío de emails (quedan en el log); el resto de los avisos sigue igual.
    enabled: true
    from: "FleetMaintenance <avisos@fleetguard.local>"
  # Base de los links de los emails (el link de un aviso es una ruta del front).
  frontend-url: http://localhost:5173
  maintenance-alerts:
    # CAM-118: revisión diaria de vencimientos por fecha, a las 8 de Argentina (los de km se revisan
    # además cada vez que sube el km del vehículo).
    cron: "0 0 8 * * *"
