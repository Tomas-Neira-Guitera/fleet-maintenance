openapi: 3.0.3
info:
  title: FleetGuard API — Inspecciones DVIR (CAM-11), login (CAM-43), mantenimiento preventivo (CAM-40) programación (CAM-42) y órdenes de trabajo (CAM-14, CAM-60)
  description: >
    Contrato para la carga de inspecciones pre-trip / post-trip del chofer y
    para la consulta de los defectos que generan (CAM-13). Cubre el listado
    de vehículos, la subida de fotos de defectos, el envío de la inspección
    y el listado de defectos, además del login (CAM-43). No cubre roles /
    autorización por rol todavía, ni las órdenes de trabajo de mantenimiento
    (son consumidoras de este listado, no parte de él).


    También cubre el mantenimiento preventivo y el componente "Estado de la
    flota" del dashboard de admin (CAM-40): catálogo de planes de
    mantenimiento, asignación de planes a vehículos, registro de
    completions, y la vista agregada de GET /api/vehicles?view=fleet-status.
    Ver docs/api/CAM-40-fleet-status-contract.md para el detalle de
    decisiones de diseño.


    Y la programación de mantenimientos y arreglos de defectos (CAM-42,
    CAM-50, CAM-51): cuándo se planea hacer un mantenimiento o resolver un
    defecto, distinto de cuándo corresponde (calculado) y de cuándo ya se
    hizo (historial). Ver docs/api/CAM-42-schedule-contract.md.


    Y las órdenes de trabajo (CAM-14, CAM-15, CAM-62, CAM-63), con el
    técnico a cargo (CAM-60) y el listado de usuarios de solo lectura que
    alimenta su selector. Ver docs/api/CAM-60-technician-contract.md.
  version: "1.6"

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /api/vehicles:
    get:
      summary: Listar vehículos de la flota, o su estado de mantenimiento (CAM-40)
      description: >
        Sin `view` (o `view` ausente): devuelve todos los vehículos con su
        estado de viaje actual (disponible / en viaje), para que el chofer
        elija uno -- CAM-11.


        Con `view=fleet-status`: vista agregada para el dashboard de admin
        (CAM-40) -- una fila por vehículo con su estado de mantenimiento,
        health score y próximo mantenimiento más urgente ya calculados
        server-side, paginada. No es un recurso nuevo, es la misma entidad
        vehículo con otra proyección -- ver CAM-40-maintenance-api-contract.md,
        sección "División de recursos".
      parameters:
        - name: view
          in: query
          description: Si es "fleet-status", cambia la forma de la respuesta (ver arriba).
          schema:
            type: string
            enum: [fleet-status]
        - name: page
          in: query
          description: Solo aplica con view=fleet-status. Default 1.
          schema:
            type: integer
        - name: pageSize
          in: query
          description: Solo aplica con view=fleet-status. Default 20.
          schema:
            type: integer
        - name: status
          in: query
          description: Solo aplica con view=fleet-status. Filtra por estado del vehículo.
          schema:
            $ref: "#/components/schemas/MaintenanceStatus"
        - name: active
          in: query
          description: >
            CAM-25. Filtra por vehículos activos o dados de baja, en las dos
            formas de la respuesta (con y sin `view`). Default true -- un
            vehículo dado de baja no aparece ni para el chofer ni en "Estado
            de la flota" salvo que se pida `active=false` explícito.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: >
            Array de VehicleSummary sin `view`, o FleetStatusPage con
            `view=fleet-status` (ver el parámetro `view`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/VehicleSummary"
                  - $ref: "#/components/schemas/FleetStatusPage"
    post:
      summary: Alta de un vehículo (CAM-25)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequest"
      responses:
        "201":
          description: Vehículo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleSummary"
        "409":
          description: DUPLICATE_PLATE -- ya existe un vehículo con esa patente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/vehicles/{id}/history:
    get:
      summary: Historial de un vehículo (CAM-22)
      description: >
        Inspecciones, defectos y mantenimientos realizados del vehículo, cada
        lista ordenada de más reciente a más antigua. Funciona también para un
        vehículo dado de baja. No hay órdenes de trabajo todavía: `maintenance`
        son los registros de "marcar como hecho" (`workOrderId` es texto libre).
        Ver CAM-22-vehicle-history-contract.md.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleHistory"
        "404":
          description: VEHICLE_NOT_FOUND

  /api/vehicles/{id}:
    get:
      summary: Detalle de un vehículo (CAM-22)
      description: Mismo shape que un item de `GET /api/vehicles`. Devuelve también vehículos dados de baja.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleSummary"
        "404":
          description: VEHICLE_NOT_FOUND
    patch:
      summary: Editar un vehículo, o reactivarlo (CAM-25)
      description: >
        Campos ausentes no se modifican. `active: true` reactiva un vehículo
        dado de baja. Si el vehículo está dado de baja, el único PATCH
        permitido es `{ "active": true }` solo -- cualquier otro campo
        (junto con la reactivación o sin ella) devuelve `409 VEHICLE_INACTIVE`.
        Ver CAM-25-vehicle-abm-contract.md.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleSummary"
        "404":
          description: VEHICLE_NOT_FOUND
        "409":
          description: >
            DUPLICATE_PLATE -- si se cambia la patente a una que ya existe.
            VEHICLE_INACTIVE -- si se edita cualquier campo de un vehículo
            dado de baja sin reactivarlo primero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                duplicatePlate:
                  value: { error: "DUPLICATE_PLATE", message: "Ya existe un vehículo con la patente AB123CD" }
                vehicleInactive:
                  value: { error: "VEHICLE_INACTIVE", message: "El vehículo está dado de baja -- reactivalo primero con PATCH { \"active\": true }" }
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"
    delete:
      summary: Dar de baja un vehículo (CAM-25)
      description: >
        Baja lógica: pone `active=false`, no borra la fila ni su historial
        (inspecciones, defectos, asignaciones de mantenimiento). Ver
        CAM-25-vehicle-abm-contract.md.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dado de baja
        "404":
          description: VEHICLE_NOT_FOUND
        "409":
          description: VEHICLE_ON_TRIP -- el vehículo tiene un viaje abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/photos:
    post:
      summary: Subir la foto de un defecto (paso 1 de 2)
      description: >
        Subida independiente de la foto. El chofer saca la foto y se sube en
        cuanto está lista, antes de enviar la inspección completa — así una
        conexión inestable no obliga a reintentar todo el formulario. La URL
        devuelta se referencia luego en el campo defect.photoUrl del envío
        de la inspección.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: image/jpeg o image/png, máx. 8MB.
      responses:
        "201":
          description: Foto subida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResult"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/photos/{photoId}:
    get:
      summary: Servir el binario de una foto subida
      description: >
        Devuelve el contenido de la foto (Content-Type segun el archivo
        original). Es lo que resuelve la photoUrl devuelta por
        POST /api/photos -- sin este endpoint esa URL no apuntaria a nada.
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No existe una foto con ese id

  /api/auth/login:
    post:
      summary: Autenticar usuario y contraseña, devolver un JWT + rol (CAM-43)
      description: >
        Solo autentica y emite el token -- no incluye alta ni invitación de
        usuarios (CAM-23, a futuro). Los usuarios de prueba se cargan a mano
        con docs/db/seed-users.sql. Todavía no reemplaza al header temporal
        X-Driver-Id de CAM-11 -- conviven hasta que el frontend (CAM-45) esté
        migrado. Ver docs/api/CAM-43-login-contract.md para el detalle de
        decisiones (comparación contra hash dummy para evitar timing attacks,
        motivo de emitir HS512, etc).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: >
            Usuario inexistente, contraseña incorrecta, o credenciales vacías
            -- mismo error para los tres casos a propósito, para no revelar
            si el usuario existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: INVALID_CREDENTIALS
                message: Usuario o contraseña incorrectos.

  /api/inspections/{vehicleId}:
    post:
      summary: Enviar una inspección pre-trip o post-trip
      description: >
        Recurso separado de /api/vehicles: /api/vehicles es la entidad vehículo
        (CRUD e info de flota — CAM-11 solo consume el GET, el resto lo define
        la historia de gestión de flota); /api/inspections es el recurso que
        concentra todo lo relacionado a crear/consultar inspecciones, tomando
        el vehículo como referencia en el path en vez de anidarse bajo él.
        Endpoint único para ambos tipos de inspección; el server valida que
        el `type` enviado sea coherente con el estado actual del vehículo:
        pre-trip solo si NO tiene viaje abierto (lo abre), post-trip solo si
        SÍ tiene uno abierto (lo cierra). El chofer y la fecha/hora del envío
        se resuelven server-side (token de auth y reloj del servidor) — nunca
        se confían del body, aunque el cliente los mande.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionSubmission"
      responses:
        "201":
          description: Inspección registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResult"
        "404":
          description: Vehículo inexistente
        "409":
          description: >
            El `type` enviado no es válido para el estado actual del vehículo
            (ej. pre-trip sobre un vehículo que ya está "en viaje", o post-trip
            sobre uno sin viaje abierto).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                vehicleOnTrip:
                  value: { error: "VEHICLE_ON_TRIP", message: "El vehículo ya tiene un pre-trip abierto." }
                noOpenTrip:
                  value: { error: "NO_OPEN_TRIP", message: "El vehículo no tiene un viaje abierto para cerrar." }
        "422":
          description: Faltan respuestas obligatorias o un defecto no cumple sus reglas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /api/defects:
    get:
      summary: Listar defectos reportados en inspecciones
      description: >
        Devuelve todos los defectos (severity blocking/non-blocking) generados
        por respuestas de inspección con outcome=defect, ordenados por
        severidad (blocking primero) y luego por fecha, más reciente primero.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefectSummary"

  /api/maintenance-plans:
    get:
      summary: Listar el catálogo de planes de mantenimiento
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: true
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenancePlan"
    post:
      summary: Crear un plan nuevo en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenancePlanRequest"
      responses:
        "201":
          description: Plan creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePlan"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/maintenance-plans/{id}:
    patch:
      summary: Editar nombre/categoría/intervalo de un plan (campos parciales)
      description: >
        Cambiar el intervalo de un plan no recalcula nextDue* de las
        asignaciones existentes -- aplica desde el próximo completion (fuera
        de alcance el recálculo masivo, ver el contrato).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenancePlanRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePlan"
        "404":
          description: No existe un plan con ese id
        "409":
          description: "PLAN_INACTIVE -- hay que reactivarlo primero con { \"active\": true }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"
    delete:
      summary: Borrar un plan del catálogo
      description: >
        Solo si no tiene ninguna asignación (activa ni inactiva) en ningún
        vehículo -- si tiene, 409 PLAN_IN_USE y hay que desactivarlo.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Borrado
        "404":
          description: No existe un plan con ese id
        "409":
          description: PLAN_IN_USE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/vehicles/{vehicleId}/maintenance-assignments:
    get:
      summary: Planes asignados a un vehículo, con estado calculado
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceAssignment"
    post:
      summary: Asignar un plan del catálogo a este vehículo
      description: >
        Ver CAM-40-maintenance-api-contract.md decisión 4 (no se puede
        asignar el mismo plan activo dos veces al mismo vehículo).
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAssignment"
        "404":
          description: VEHICLE_NOT_FOUND o MAINTENANCE_PLAN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: DUPLICATE_ACTIVE_ASSIGNMENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/vehicles/{vehicleId}/maintenance-assignments/{assignmentId}:
    patch:
      summary: Activar/desactivar o corregir una asignación (no cuenta como completion)
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAssignment"
        "404":
          description: "ASSIGNMENT_NOT_FOUND (incluye si pertenece a otro vehicleId)"
    delete:
      summary: Desasignar un plan de este vehículo (soft-delete, active=false)
      description: Los completions ya registrados no se tocan.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Desasignado
        "404":
          description: ASSIGNMENT_NOT_FOUND

  /api/vehicles/{vehicleId}/maintenance-assignments/{assignmentId}/completions:
    get:
      summary: Historial de veces que se hizo ese mantenimiento
      description: Más reciente primero. Sin paginar en esta primera versión.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceCompletion"
    post:
      summary: Registrar que el mantenimiento se hizo (dispara recálculo)
      description: >
        A diferencia de las inspecciones DVIR, completedAt lo manda el
        cliente (puede estar cargando algo que ya pasó) -- ver
        CAM-40-maintenance-api-contract.md decisión 2.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompletionRequest"
      responses:
        "201":
          description: Completion registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResult"
        "404":
          description: ASSIGNMENT_NOT_FOUND
        "409":
          description: "ASSIGNMENT_INACTIVE -- hay que reactivar la asignación primero"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: FUTURE_DATE, OUT_OF_ORDER_COMPLETION, o falta completedKm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldValidationError"

  /api/vehicles/{id}/odometer:
    patch:
      summary: Cargar el kilometraje actual del vehículo (feature 5.5)
      description: >
        No toca nextDueKm de ningún plan (eso solo cambia con un completion) --
        solo actualiza la referencia contra la que se compara al calcular status.
        Bloqueado con `409 VEHICLE_INACTIVE` si el vehículo está dado de baja
        (ver CAM-25-vehicle-abm-contract.md) -- reactivalo primero.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOdometerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdometerResult"
        "404":
          description: VEHICLE_NOT_FOUND
        "409":
          description: VEHICLE_INACTIVE -- el vehículo está dado de baja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: ODOMETER_REGRESSION (el kilometraje no puede bajar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldValidationError"

  /api/maintenance-schedule:
    get:
      summary: Mantenimientos programados en un rango de fechas (calendario semanal del Resumen, CAM-42)
      description: >
        Por defecto solo trae status=scheduled (lo que interesa ver "por
        venir"); el query param status permite pedir también done/cancelled
        para vistas de historial futuras.
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio del rango. Acepta fecha (YYYY-MM-DD, se toma como inicio del día UTC) o timestamp ISO-8601 completo.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Fin del rango, mismo formato que `from`.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleStatus"
            default: scheduled
        - name: vehicleId
          in: query
          description: Filtro opcional por vehículo, de uso general (no lo usa el preview de "ya programado", que mira todos los vehículos ese día).
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"
    post:
      summary: Programar un mantenimiento (origen assignment CAM-50, defect CAM-51, o manual desde el calendario)
      description: >
        Endpoint único genérico: para sourceType assignment/defect el
        servidor resuelve vehicleId y title a partir de sourceId, nunca se
        confían del cliente; para sourceType=manual el cliente manda
        vehicleId y title directo, ya que no hay plan ni defecto de origen.
        Si ya existe una programación activa (status=scheduled) para ese
        sourceId, actualiza esa fila (upsert, devuelve 200) en vez de crear
        una nueva -- evita duplicados en el calendario (manual siempre crea
        una fila nueva, no dedupea). Ver docs/api/CAM-42-schedule-contract.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Programación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "200":
          description: Ya existía una programación activa para ese origen -- se actualizó la fecha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: ASSIGNMENT_NOT_FOUND o DEFECT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "ASSIGNMENT_INACTIVE / DEFECT_RESOLVED -- no tiene sentido programar algo cerrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "sourceType/sourceId inválidos, vehicleId/title faltantes en manual, o scheduledAt ausente/pasado (PAST_DATE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldValidationError"

  /api/maintenance-schedule/{id}:
    patch:
      summary: Reprogramar, cancelar, o marcar como realizado un mantenimiento programado
      description: >
        status=done solo es válido para sourceType=defect -- una programación
        de origen assignment se cierra sola al registrar el completion de esa
        asignación (409 USE_COMPLETION_ENDPOINT si se intenta acá).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: SCHEDULE_NOT_FOUND
        "409":
          description: USE_COMPLETION_ENDPOINT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"


  # --- Órdenes de trabajo (CAM-14, CAM-15, CAM-62, CAM-63) y técnico a cargo (CAM-60) ---

  /api/work-orders:
    get:
      summary: Listar órdenes de trabajo, de la más nueva a la más vieja
      description: >
        Todos los filtros son opcionales y combinables. technicianId es el
        vínculo técnico ↔ vehículos (CAM-60): las OTs de un técnico traen
        vehicleId/plate. Un technicianId que no corresponde a ninguna OT
        (incluido uno malformado) devuelve una lista vacía, no un error.
      parameters:
        - name: vehicleId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkOrderStatus"
        - name: executionType
          in: query
          schema:
            $ref: "#/components/schemas/WorkOrderExecutionType"
        - name: technicianId
          in: query
          description: Id de un usuario con rol TECNICO (CAM-60).
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkOrder"
    post:
      summary: Crear una orden de trabajo (desde un mantenimiento programado, un defecto, o manual)
      description: >
        Para sourceType scheduled_maintenance/defect el servidor resuelve
        vehicleId y title a partir de sourceId; para manual los manda el
        cliente. Nace en status=asignada. Ver docs/api/CAM-60-technician-contract.md
        para las reglas de technicianId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrderRequest"
      responses:
        "201":
          description: Orden de trabajo creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "404":
          description: SCHEDULE_NOT_FOUND, DEFECT_NOT_FOUND o VEHICLE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: DEFECT_RESOLVED -- no se abre una OT sobre un defecto ya resuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/work-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Detalle de una orden de trabajo, con gastos y fotos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "404":
          description: WORK_ORDER_NOT_FOUND
    patch:
      summary: Editar datos y/o avanzar de estado una orden de trabajo
      description: >
        Campos parciales: lo que no viene no se toca. Transiciones válidas:
        asignada→en_proceso, en_proceso→finalizada, asignada|en_proceso→cancelada.
        Finalizar exige closingDescription y al menos una foto, y cierra el
        origen (completion de la asignación, programación o defecto).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkOrderRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "404":
          description: WORK_ORDER_NOT_FOUND
        "409":
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/work-orders/{id}/expenses:
    post:
      summary: Cargar un gasto a una orden de trabajo abierta (CAM-63)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrderExpenseRequest"
      responses:
        "201":
          description: Gasto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderExpense"
        "404":
          description: WORK_ORDER_NOT_FOUND
        "409":
          description: WORK_ORDER_FINALIZED -- la OT está finalizada o cancelada
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/work-orders/{id}/expenses/{expenseId}:
    delete:
      summary: Borrar un gasto de una orden de trabajo abierta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Borrado
        "404":
          description: WORK_ORDER_NOT_FOUND (también si el gasto no es de esa OT)
        "409":
          description: WORK_ORDER_FINALIZED

  /api/work-orders/{id}/photos:
    post:
      summary: Adjuntar una foto (ya subida con POST /api/photos) a una orden de trabajo abierta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrderPhotoRequest"
      responses:
        "201":
          description: Foto adjuntada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderPhoto"
        "404":
          description: WORK_ORDER_NOT_FOUND
        "409":
          description: WORK_ORDER_CLOSED
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"

  /api/work-orders/{id}/photos/{photoId}:
    delete:
      summary: Quitar una foto de una orden de trabajo abierta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: photoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Borrada
        "404":
          description: WORK_ORDER_NOT_FOUND (también si la foto no es de esa OT)
        "409":
          description: WORK_ORDER_CLOSED

  /api/users:
    get:
      summary: Listar usuarios (solo lectura, CAM-60)
      description: >
        Existe para poblar el selector de técnico de una orden de trabajo
        (role=TECNICO). No es gestión de usuarios (alta, invitaciones, roles):
        eso es CAM-23. Nunca devuelve el hash de la contraseña.
      parameters:
        - name: role
          in: query
          required: true
          description: Obligatorio -- sin JWT que proteja el endpoint, no se lista el total de usuarios.
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: OK, ordenado por username
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSummary"
        "422":
          $ref: "#/components/responses/FieldValidationErrorResponse"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    PayloadTooLarge:
      description: La foto supera el tamaño máximo permitido (8MB)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: El archivo no es image/jpeg ni image/png
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    FieldValidationErrorResponse:
      description: Datos inválidos (CAM-40) -- details[] usa "field", no "itemId".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FieldValidationError"

  schemas:
    VehicleStatus:
      type: string
      enum: [available, on-trip]

    VehicleSummary:
      type: object
      required: [id, plate, brand, model, status, odometerKm, active]
      properties:
        id: { type: string }
        plate: { type: string, example: "AB123CD" }
        brand: { type: string, example: "Mercedes-Benz" }
        model: { type: string, example: "Sprinter" }
        status:
          $ref: "#/components/schemas/VehicleStatus"
        vehicleType: { type: string, nullable: true, example: "furgon" }
        year: { type: integer, nullable: true, example: 2022 }
        chassisNumber: { type: string, nullable: true }
        odometerKm: { type: integer }
        active:
          type: boolean
          description: >
            false si el vehículo está dado de baja (CAM-25) -- ver el
            parámetro `active` de GET /api/vehicles.

    CreateVehicleRequest:
      type: object
      required: [plate, brand, model]
      properties:
        plate: { type: string }
        brand: { type: string }
        model: { type: string }
        vehicleType: { type: string }
        year: { type: integer }
        chassisNumber: { type: string }
        odometerKm: { type: integer, description: Kilometraje inicial, default 0. }

    UpdateVehicleRequest:
      type: object
      description: Campos ausentes (null) no se modifican.
      properties:
        plate: { type: string }
        brand: { type: string }
        model: { type: string }
        vehicleType: { type: string }
        year: { type: integer }
        chassisNumber: { type: string }
        active:
          type: boolean
          description: En false da de baja; en true reactiva (ver CAM-25-vehicle-abm-contract.md).

    PhotoUploadResult:
      type: object
      required: [photoId, photoUrl]
      properties:
        photoId: { type: string }
        photoUrl: { type: string, format: uri }

    DefectSeverity:
      type: string
      enum: [non-blocking, blocking]

    DefectDetail:
      type: object
      required: [severity, description]
      properties:
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        description:
          type: string
          minLength: 1
        photoUrl:
          type: string
          format: uri
          description: >
            Requerido por el servidor cuando severity=blocking (ver reglas de
            validación en CAM-11-dvir-contract.md). Viene de POST /api/photos.

    ChecklistAnswer:
      type: object
      required: [itemId]
      description: >
        El cliente manda solo lo que el chofer completó; el servidor resuelve
        la definición del ítem (label/sección/tipo/si es obligatorio) por su
        propio catálogo — no confía en metadata que mande el cliente.
      properties:
        itemId:
          type: string
          example: neumaticos
        outcome:
          type: string
          enum: [ok, defect]
          description: Presente en ítems tipo check.
        numberValue:
          type: number
          description: Presente en ítems tipo número (ej. kilómetros).
        defect:
          $ref: "#/components/schemas/DefectDetail"

    InspectionSubmission:
      type: object
      required: [type, answers]
      properties:
        type:
          type: string
          enum: [pre-trip, post-trip]
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistAnswer"
        notes:
          type: string
          description: Campo general de novedades, opcional (típicamente post-trip).

    Trip:
      type: object
      properties:
        id: { type: string }
        vehicleId: { type: string }
        status: { type: string, enum: [open, closed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }

    Inspection:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        vehicleId: { type: string }
        driverId: { type: string, description: Resuelto del token, no del body. }
        type: { type: string, enum: [pre-trip, post-trip] }
        timestamp: { type: string, format: date-time, description: Reloj del servidor. }
        odometerKm: { type: number }
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistAnswer"
        notes: { type: string }
        hasBlockingDefect: { type: boolean }

    InspectionResult:
      type: object
      properties:
        inspection:
          $ref: "#/components/schemas/Inspection"
        trip:
          $ref: "#/components/schemas/Trip"

    DefectSummary:
      type: object
      required: [id, severity, description, createdAt, status]
      properties:
        id: { type: string }
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        description: { type: string }
        photoUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
        vehicleId: { type: string }
        vehiclePlate: { type: string, nullable: true, description: Puede faltar si el vehículo fue eliminado. }
        status: { type: string, description: Reservado para la futura gestión de defectos; hoy siempre "open". }
        reportedBy: { type: string, nullable: true, description: "Nombre del chofer que reportó el defecto (Inspection.driverName); puede faltar en datos antiguos." }

    VehicleHistory:
      type: object
      required: [inspections, defects, maintenance]
      properties:
        inspections:
          type: array
          items:
            $ref: "#/components/schemas/InspectionHistoryItem"
        defects:
          type: array
          items:
            $ref: "#/components/schemas/DefectSummary"
        maintenance:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceHistoryItem"

    InspectionHistoryItem:
      type: object
      required: [id, type, timestamp, hasBlockingDefect]
      properties:
        id: { type: string }
        type: { type: string, enum: [pre-trip, post-trip] }
        timestamp: { type: string, format: date-time }
        driverName: { type: string, nullable: true }
        odometerKm: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        hasBlockingDefect: { type: boolean }

    MaintenanceHistoryItem:
      type: object
      required: [id, planName, completedAt]
      properties:
        id: { type: string }
        planName: { type: string }
        completedAt: { type: string, format: date, example: "2026-09-10" }
        completedKm: { type: integer, format: int64, nullable: true }
        workOrderId: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Role:
      type: string
      description: TECNICO desde CAM-67 (usuario de taller).
      enum: [ADMIN, CHOFER, TECNICO]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: admin123 }

    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
          description: >
            JWT firmado (HS512, según el largo de fleetguard.jwt.secret),
            vence a los fleetguard.jwt.expiration-minutes (60 min por
            defecto). Incluye sub (id de usuario), username y role como claims.
        role:
          $ref: "#/components/schemas/Role"

    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  itemId: { type: string }
                  message: { type: string }

    FieldValidationError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    # --- Mantenimiento preventivo y estado de flota (CAM-40) ---

    MaintenanceStatus:
      type: string
      enum: [al_dia, por_vencer, vencido]

    IntervalType:
      type: string
      enum: [km, time, both]

    NextMaintenanceSummary:
      type: object
      nullable: true
      description: Null si el vehículo no tiene ningún plan activo asignado.
      required: [assignmentId, name, status]
      properties:
        assignmentId: { type: string }
        name: { type: string, example: "VTV" }
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        dueDate: { type: string, format: date, nullable: true }
        dueKm: { type: integer, nullable: true }
        remainingDays: { type: integer, nullable: true, description: Negativo si está vencido. }
        remainingKm: { type: integer, nullable: true, description: Negativo si está vencido. }

    FleetStatusRow:
      type: object
      required: [vehicleId, plate, brand, model, odometerKm, healthScore, status]
      properties:
        vehicleId: { type: string }
        plate: { type: string }
        brand: { type: string }
        model: { type: string }
        vehicleType: { type: string, nullable: true }
        odometerKm: { type: integer }
        healthScore: { type: integer, minimum: 0, maximum: 100 }
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        nextMaintenance:
          $ref: "#/components/schemas/NextMaintenanceSummary"

    FleetStatusPage:
      type: object
      required: [page, pageSize, total, items]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/FleetStatusRow"

    MaintenancePlan:
      type: object
      required: [id, name, intervalType, active]
      properties:
        id: { type: string }
        name: { type: string, example: "Cambio de aceite" }
        category: { type: string, nullable: true, example: "motor" }
        intervalType:
          $ref: "#/components/schemas/IntervalType"
        intervalKm: { type: integer, nullable: true }
        intervalDays: { type: integer, nullable: true }
        active: { type: boolean }

    CreateMaintenancePlanRequest:
      type: object
      required: [name, intervalType]
      description: >
        intervalKm/intervalDays son obligatorios o deben venir null según
        intervalType -- ver CAM-40-maintenance-api-contract.md decisión 5.
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        intervalType:
          $ref: "#/components/schemas/IntervalType"
        intervalKm: { type: integer }
        intervalDays: { type: integer }

    UpdateMaintenancePlanRequest:
      type: object
      description: Campos ausentes (null) no se modifican.
      properties:
        name: { type: string }
        category: { type: string }
        intervalType:
          $ref: "#/components/schemas/IntervalType"
        intervalKm: { type: integer }
        intervalDays: { type: integer }
        active: { type: boolean }

    MaintenanceAssignment:
      type: object
      required: [id, vehicleId, maintenancePlanId, status, active]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        maintenancePlanId: { type: string }
        planName: { type: string }
        intervalType:
          $ref: "#/components/schemas/IntervalType"
        lastDoneKm: { type: integer, nullable: true }
        lastDoneDate: { type: string, format: date, nullable: true }
        nextDueKm: { type: integer, nullable: true }
        nextDueDate: { type: string, format: date, nullable: true }
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        active: { type: boolean }

    CreateAssignmentRequest:
      type: object
      required: [maintenancePlanId]
      description: >
        Si se omiten lastDoneKm/lastDoneDate, el servidor los siembra con el
        kilometraje/fecha actual del vehículo (ver contrato).
      properties:
        maintenancePlanId: { type: string }
        lastDoneKm: { type: integer }
        lastDoneDate: { type: string, format: date }

    UpdateAssignmentRequest:
      type: object
      description: >
        Corrección administrativa -- no cuenta como completion. Campos
        ausentes (null) no se modifican.
      properties:
        active: { type: boolean }
        lastDoneKm: { type: integer }
        lastDoneDate: { type: string, format: date }

    MaintenanceCompletion:
      type: object
      required: [id, completedAt]
      properties:
        id: { type: string }
        completedAt: { type: string, format: date }
        completedKm: { type: integer, nullable: true }
        workOrderId: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    CreateCompletionRequest:
      type: object
      required: [completedAt]
      description: >
        completedAt siempre viaja; completedKm es condicional al
        intervalType del plan (ver contrato decisión 5).
      properties:
        completedAt: { type: string, format: date }
        completedKm: { type: integer }
        workOrderId: { type: string }
        notes: { type: string }

    AssignmentSummary:
      type: object
      required: [id, status]
      description: Subconjunto de MaintenanceAssignment devuelto inline para refrescar el chip de estado.
      properties:
        id: { type: string }
        nextDueKm: { type: integer, nullable: true }
        nextDueDate: { type: string, format: date, nullable: true }
        status:
          $ref: "#/components/schemas/MaintenanceStatus"

    CompletionResult:
      type: object
      required: [id, assignmentId, completedAt, updatedAssignment]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        completedAt: { type: string, format: date }
        completedKm: { type: integer, nullable: true }
        workOrderId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        updatedAssignment:
          $ref: "#/components/schemas/AssignmentSummary"

    UpdateOdometerRequest:
      type: object
      required: [odometerKm]
      properties:
        odometerKm: { type: integer }

    OdometerResult:
      type: object
      required: [vehicleId, odometerKm, updatedAt]
      properties:
        vehicleId: { type: string }
        odometerKm: { type: integer }
        updatedAt: { type: string, format: date-time }

    # --- Programación de mantenimientos y arreglos (CAM-42, CAM-50, CAM-51) ---

    ScheduleSourceType:
      type: string
      enum: [assignment, defect, manual]

    ScheduleStatus:
      type: string
      enum: [scheduled, done, cancelled]

    Schedule:
      type: object
      required: [id, vehicleId, sourceType, title, scheduledAt, status]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        plate: { type: string, nullable: true }
        sourceType:
          $ref: "#/components/schemas/ScheduleSourceType"
        assignmentId: { type: string, nullable: true, description: Presente si sourceType=assignment. }
        defectId: { type: string, nullable: true, description: Presente si sourceType=defect. }
        title: { type: string, example: "Cambio de aceite" }
        scheduledAt: { type: string, format: date-time }
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        notes: { type: string, nullable: true }

    CreateScheduleRequest:
      type: object
      required: [sourceType, scheduledAt]
      description: >
        sourceId es obligatorio si sourceType es assignment/defect;
        vehicleId+title son obligatorios si sourceType es manual (no hay
        plan ni defecto del que resolverlos).
      properties:
        sourceType:
          $ref: "#/components/schemas/ScheduleSourceType"
        sourceId: { type: string, description: assignmentId si sourceType=assignment, defectId si sourceType=defect. Ignorado si sourceType=manual. }
        vehicleId: { type: string, description: Obligatorio si sourceType=manual. }
        title: { type: string, description: Obligatorio si sourceType=manual. }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }

    UpdateScheduleRequest:
      type: object
      description: Campos parciales -- reprogramar (scheduledAt) y cambiar status pueden venir juntos o por separado.
      properties:
        scheduledAt: { type: string, format: date-time }
        status:
          type: string
          enum: [done, cancelled]

    # --- Órdenes de trabajo (CAM-14, CAM-15, CAM-62, CAM-63, CAM-60) ---

    WorkOrderSourceType:
      type: string
      enum: [scheduled_maintenance, defect, manual]

    WorkOrderExecutionType:
      type: string
      description: interno = personal propio (puede tener técnico); externo = taller de terceros (CAM-62).
      enum: [interno, externo]

    WorkOrderStatus:
      type: string
      enum: [asignada, en_proceso, finalizada, cancelada]

    WorkOrderExpenseCategory:
      type: string
      enum: [repuesto, mano_de_obra, otro]

    WorkOrder:
      type: object
      required: [id, vehicleId, sourceType, title, executionType, status, expenses, totalExpenses, photos, createdAt, updatedAt]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        plate: { type: string, nullable: true }
        sourceType:
          $ref: "#/components/schemas/WorkOrderSourceType"
        scheduledMaintenanceId: { type: string, nullable: true }
        defectId: { type: string, nullable: true }
        defect:
          type: object
          allOf:
            - $ref: "#/components/schemas/DefectSummary"
          nullable: true
          description: "El defecto de origen (CAM-60), con la misma forma que GET /api/defects: gravedad, foto y quién lo reportó, para el técnico. Null si la OT no viene de un defecto; puede ser null aunque defectId no lo sea (defectId no tiene FK), así que no hay que asumirlo a partir de defectId."
        assignmentId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        executionType:
          $ref: "#/components/schemas/WorkOrderExecutionType"
        externalProvider: { type: string, nullable: true, description: Obligatorio si executionType=externo. }
        assignee: { type: string, nullable: true, description: "Texto libre. En OTs externas, el contacto en el proveedor; en internas lo reemplaza technicianId (CAM-60)." }
        technicianId: { type: string, nullable: true, description: "Usuario con rol TECNICO a cargo (CAM-60). Solo en OTs internas." }
        technicianUsername: { type: string, nullable: true, description: Resuelto por el servidor a partir de technicianId. }
        status:
          $ref: "#/components/schemas/WorkOrderStatus"
        closingDescription: { type: string, nullable: true }
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/WorkOrderExpense"
        totalExpenses: { type: number }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/WorkOrderPhoto"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time, nullable: true }

    CreateWorkOrderRequest:
      type: object
      required: [sourceType, executionType]
      description: >
        sourceId es obligatorio si sourceType es scheduled_maintenance/defect;
        vehicleId+title son obligatorios si sourceType es manual.
      properties:
        sourceType:
          $ref: "#/components/schemas/WorkOrderSourceType"
        sourceId: { type: string }
        vehicleId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        executionType:
          $ref: "#/components/schemas/WorkOrderExecutionType"
        externalProvider: { type: string, nullable: true }
        assignee: { type: string, nullable: true }
        technicianId:
          type: string
          nullable: true
          description: "Opcional. Tiene que ser un usuario con rol TECNICO (422 technicianId si no) y la OT tiene que ser interna (422 si es externa)."

    UpdateWorkOrderRequest:
      type: object
      description: Campos parciales -- lo que no viene no se toca.
      properties:
        status:
          type: string
          enum: [en_proceso, finalizada, cancelada]
        closingDescription: { type: string, description: Obligatoria para finalizar. }
        completedKm: { type: integer, format: int64, nullable: true }
        assignee: { type: string }
        technicianId:
          type: string
          description: >
            Un id asigna (mismas reglas que al crear); "" desasigna. Si la OT
            pasa a executionType=externo, el técnico se desasigna solo; si pasa
            a interno, se limpian assignee y externalProvider.
        executionType:
          $ref: "#/components/schemas/WorkOrderExecutionType"
        externalProvider: { type: string }
        description: { type: string }

    WorkOrderExpense:
      type: object
      required: [id, category, description, amount, createdAt]
      properties:
        id: { type: string }
        category:
          $ref: "#/components/schemas/WorkOrderExpenseCategory"
        description: { type: string }
        amount: { type: number }
        createdAt: { type: string, format: date-time }

    CreateWorkOrderExpenseRequest:
      type: object
      required: [category, description, amount]
      properties:
        category:
          $ref: "#/components/schemas/WorkOrderExpenseCategory"
        description: { type: string }
        amount: { type: number, minimum: 0, exclusiveMinimum: true }

    WorkOrderPhoto:
      type: object
      required: [id, photoUrl, createdAt]
      properties:
        id: { type: string }
        photoUrl: { type: string }
        createdAt: { type: string, format: date-time }

    CreateWorkOrderPhotoRequest:
      type: object
      required: [photoUrl]
      properties:
        photoUrl: { type: string, description: La URL que devolvió POST /api/photos. }

    UserSummary:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role:
          $ref: "#/components/schemas/Role"
